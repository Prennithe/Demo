<!DOCTYPE html>
<html>
<head>
  <title>My Portfolio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f4;
    }

    header {
      background-color: #333;
      color: white;
      padding: 20px;
      border-radius: 10px;
    }

    section {
      background-color: white;
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 5px #ccc;
    }

    h1, h2 {
      color: #333;
    }

    button {
      padding: 8px 16px;
      background-color: #008CBA;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #006f98;
    }
  </style>
</head>
<body>

  <header>
    <h1>My Portfolio</h1>
    <p>Hello! I'm a web developer passionate about coding and design.</p>
  </header>

  <section id="skills">
    <h2>Skills</h2>
    <ul>
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
    </ul>
  </section>

  <section id="projects">
    <h2>Projects</h2>
    <p>1. Portfolio Website</p>
    <p>2. Calculator App</p>
  </section>

  <section id="contact">
    <h2>Contact Me</h2>
    <p>Email: me@example.com</p>
    <button onclick="showMessage()">Click Me!</button>
    <p id="message"></p>
  </section>

  <script>
    function showMessage() {
      document.getElementById("message").innerText = "Thanks for visiting!";
    }
  </script>

</body>
</html>
